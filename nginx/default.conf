# Novanet LLC — nginx config (HTTPS is handled by Easypanel's proxy)

map $http_user_agent $bad_bot {
    default 0;
    ""      1;
    "-"     1;
    "~*(AhrefsBot|SemrushBot|MJ12bot|DotBot|BLEXBot|PetalBot|MegaIndex|DataForSeoBot|serpstatbot|Bytespider|ZoominfoBot|masscan|nikto|sqlmap|nmap|zgrab|python-requests|Go-http-client|libwww-perl|curl|wget|HTTrack|scrapy)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript text/plain text/xml application/xml application/manifest+json image/svg+xml;

    # Only normal methods
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) { return 405; }

    # Block bad bots and scanners
    if ($bad_bot) { return 403; }
    location ~* ^/(wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|admin\.php|cgi-bin) { return 403; }

    # Hide dotfiles and config/repo files
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(env|ini|log|sh|sql|bak|old|swp|md|lock|ya?ml|conf)$ { return 404; }

    # One canonical URL
    location = /index.html {
        if ($request_uri ~* "^/index\.html") { return 301 /; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Pages
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Runtime config generated at startup: never cache
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Static assets: long cache (CSS/JS are versioned with ?v=)
    location ~* \.(css|js|woff2|png|jpe?g|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    error_page 404 /index.html;
}
